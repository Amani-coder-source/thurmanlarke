<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Thurmanlark</title>

    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <header>
        <nav class="navbar">

            <div class="logo">
                THURMANLARK
            </div>

            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/login">Login</a>
            </div>

        </nav>
    </header>


    <main class="auth-page">

        <div class="auth-container">

            <div class="auth-heading">

                <p class="small-title">
                    THURMANLARK
                </p>

                <h1>
                    Create your account
                </h1>

                <p>
                    Create an account to access Thurmanlark's
                    legal services and manage your legal matters.
                </p>

            </div>


            <form action="/register" method="POST">

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirm_password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <button type="submit" class="auth-button">
                    Create Account
                </button>

            </form>


            <div class="auth-footer">

                <p>
                    Already have an account?
                    <a href="/login">Login here</a>
                </p>

            </div>

        </div>

    </main>


    <footer>

        <div class="footer-bottom">
            © 2026 Thurmanlark. All rights reserved.
        </div>

    </footer>

</body>

</html>
