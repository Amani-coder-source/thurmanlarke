<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register a Company | Thurmanlark</title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >
</head>

<body>

    <header>

        <nav class="navbar">

            <div class="logo">
                THURMANLARK
            </div>

            <div class="nav-links">

                <a href="/dashboard">
                    Dashboard
                </a>

                <a href="/logout">
                    Logout
                </a>

            </div>

        </nav>

    </header>


    <main class="auth-page">

        <div class="auth-container">

            <div class="auth-heading">

                <p class="small-title">
                    THURMANLARK
                </p>

                <h1>
                    Register a Company
                </h1>

                <p>
                    Provide the information below to
                    begin your company registration.
                </p>

            </div>


            <form
                action="/company/register"
                method="POST"
            >

                <div class="form-group">

                    <label for="company_name">
                        Company Name
                    </label>

                    <input
                        type="text"
                        id="company_name"
                        name="company_name"
                        placeholder="Enter company name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="company_type">
                        Company Type
                    </label>

                    <select
                        id="company_type"
                        name="company_type"
                        required
                    >

                        <option value="">
                            Select company type
                        </option>

                        <option value="Private Limited Company">
                            Private Limited Company
                        </option>

                        <option value="Public Limited Company">
                            Public Limited Company
                        </option>

                        <option value="Limited Liability Partnership">
                            Limited Liability Partnership
                        </option>

                        <option value="Partnership">
                            Partnership
                        </option>

                        <option value="Sole Proprietorship">
                            Sole Proprietorship
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="business_activity">
                        Business Activity
                    </label>

                    <textarea
                        id="business_activity"
                        name="business_activity"
                        placeholder="Describe what the company will do"
                        rows="5"
                        required
                    ></textarea>

                </div>


                <div class="form-group">

                    <label for="address">
                        Registered Address
                    </label>

                    <input
                        type="text"
                        id="address"
                        name="address"
                        placeholder="Enter registered address"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="city">
                        City
                    </label>

                    <input
                        type="text"
                        id="city"
                        name="city"
                        placeholder="Enter city"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="country">
                        Country
                    </label>

                    <input
                        type="text"
                        id="country"
                        name="country"
                        placeholder="Enter country"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-button"
                >
                    Submit Registration
                </button>

            </form>


            <div class="auth-footer">

                <a href="/dashboard">
                    Back to Dashboard
                </a>

            </div>

        </div>

    </main>


    <footer>

        <div class="footer-bottom">
            © 2026 Thurmanlark. All rights reserved.
        </div>

    </footer>

</body>

</html>
